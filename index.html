<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life OS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f7fa">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Life OS</title>
<style>:root{--bg:#f5f7fa;--deep:#ffffff;--c:#ffffff;--c2:#eceff4;--hl:rgba(17,24,39,.09);--t:#111827;--t2:#4b5565;--m:#6b7487;--g:#2563eb;--gi:#ffffff;--ok:#16a34a;--a:#b45309;--r:#dc2626;--ease:cubic-bezier(.22,1,.36,1);--mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{height:100%}body{margin:0}
body{min-height:calc(100% + 2px);background:var(--bg);color:var(--t);font:400 15px/1.45 Geist,-apple-system,system-ui,sans-serif;padding-top:env(safe-area-inset-top);-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
#v{padding:16px 16px 80px;max-width:640px;margin:auto;overflow-x:clip}
#dock{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));padding:0 12px;z-index:5;pointer-events:none}#dock>*{margin-top:8px;pointer-events:auto}
a{color:var(--g);text-decoration:none}
h1{font-size:24px;line-height:1.2;font-weight:500;margin:8px 0}h2{font-size:18px;font-weight:500;margin:24px 0 8px}
h3{font-size:13px;font-weight:500;color:var(--m);margin:24px 0 8px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;flex:none}
.card{background:var(--c);border:1px solid var(--hl);border-radius:14px;padding:16px;margin:8px 0}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--hl)}
.row a{flex:1;color:inherit}
small{color:var(--m);font-size:13px;line-height:1.4;display:block}
.ck{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--m);background:none;flex:none;padding:0;color:var(--gi);font-size:14px;transition:background-color .15s var(--ease),border-color .15s var(--ease)}
.ck.on{background:var(--g);border-color:var(--g)}.ck.on::after{content:"✓"}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;background:var(--c2);color:var(--t);border:1px solid var(--hl);border-radius:10px;padding:8px 16px;font:inherit;font-weight:500;margin:4px 4px 4px 0;transition:background-color .15s var(--ease),transform .15s var(--ease)}
.btn:active,.chip:active,.cta:active{transform:scale(.98)}
.btn.pri{background:var(--g);border-color:var(--g);color:var(--gi)}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:32px;background:var(--c2);border:1px solid var(--hl);border-radius:8px;padding:4px 12px;font:inherit;font-size:13px;font-weight:500;margin:0 0 8px;color:var(--t);transition:background-color .15s var(--ease),transform .15s var(--ease)}
.chip.on{background:var(--g);border-color:var(--g);color:var(--gi)}
.seg{display:flex;background:var(--c);border:1px solid var(--hl);border-radius:12px;padding:4px;margin:8px 0}
.seg button{flex:1;background:none;border:0;color:var(--t2);min-height:32px;border-radius:8px;font:inherit;font-size:14px;transition:background-color .15s var(--ease)}
.seg button.on{background:var(--c2);color:var(--t);font-weight:500;box-shadow:0 1px 2px rgba(17,24,39,.08)}
input,textarea,select{background:var(--c2);color:var(--t);border:1px solid var(--hl);border-radius:10px;padding:12px;font:inherit;font-size:16px;width:100%;margin:4px 0}
input:focus,textarea:focus,select:focus{outline:2px solid var(--g);outline-offset:-1px}
input.dt{min-width:0;max-width:100%;width:100%;height:44px;-webkit-appearance:none;appearance:none;display:block}
textarea{font-family:var(--mono);font-size:14px;min-height:120px}
.bar{height:6px;background:var(--c2);border-radius:3px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--g);border-radius:3px}.bar i.o{background:var(--r)}
.w{border-radius:10px;padding:8px 12px;margin:8px 0;background:var(--c);border:1px solid var(--hl);border-left:3px solid var(--m)}.w.r{border-left-color:var(--r)}.w.a{border-left-color:var(--a)}.w.i{border-left-color:var(--g)}
nav{position:fixed;left:0;right:0;bottom:0;height:calc(56px + env(safe-area-inset-bottom));display:flex;background:var(--deep);padding-bottom:env(safe-area-inset-bottom);z-index:6;border-top:1px solid var(--hl)}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--m);font-size:12px;transition:color .15s var(--ease)}nav a.on{color:var(--g)}nav a svg.i{width:22px;height:22px}
#tb,#cx{display:none;align-items:center;gap:8px;border-radius:14px;padding:8px 12px;font-weight:500}
#tb{background:var(--g);color:var(--gi)}#cx{background:var(--a);color:#fff}
#tb button,#cx button{background:rgba(255,255,255,.22);border:0;border-radius:8px;min-height:36px;padding:8px 12px;font:inherit;color:inherit}#cxl{flex:1;font-size:14px}
.set{display:grid;grid-template-columns:24px 1fr 1fr 1fr 36px;gap:8px;align-items:center;margin:4px 0;text-align:center}
.set input{text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top h1{font-size:20px}
.strip{display:flex;gap:4px;margin:8px 0}.strip button{flex:1;background:var(--c);border:1px solid var(--hl);color:var(--t);border-radius:10px;padding:8px 0;font:inherit;transition:background-color .15s var(--ease)}
.strip .dd small{text-align:center;font-size:11px}.strip .dd b{font-weight:500}.strip .dd.on{background:var(--g);border-color:var(--g);color:var(--gi)}.strip .dd.on small{color:var(--gi)}.strip .dd.td b{text-decoration:underline;text-underline-offset:3px}
.ctl{display:flex;align-items:center;gap:8px}.ctl>span{width:44px;font-weight:500}.ctl .seg{flex:1;margin:4px 0}
.grid{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;display:flex;position:relative;height:calc(var(--z,1)*1080px);margin-top:8px;touch-action:pan-y}.gut{width:40px;position:relative;flex:none}.gut span{position:absolute;font:400 10px var(--mono);color:var(--m);transform:translateY(-6px)}
.cols{flex:1;display:flex;border-left:1px solid var(--hl);background:repeating-linear-gradient(var(--hl) 0 1px,transparent 1px calc(var(--z,1)*60px))}.col{flex:1;position:relative;border-right:1px solid var(--hl)}
.ev{position:absolute;border-radius:6px;padding:4px 8px;font-size:12px;overflow:hidden;color:var(--t);line-height:1.25;border-left:3px solid;font-variant-numeric:tabular-nums}.ev b{font-weight:500}.ev.dn{opacity:.45}
.ev.ext{background:repeating-linear-gradient(45deg,#e9ecf2 0 6px,#e0e4ec 6px 12px);border-color:#9aa3b8;color:var(--t2)}
.grid.wk .ev{font-size:10px;padding:2px 4px}
.now{position:absolute;left:0;right:0;height:1px;background:var(--r);z-index:2}.now b{position:absolute;left:-40px;top:-8px;width:36px;text-align:center;font:500 10px/16px var(--mono);background:var(--r);color:#fff;border-radius:4px}
.step{display:flex;gap:12px;align-items:center;background:var(--c);border:1px solid var(--hl);border-radius:14px;padding:12px 16px;margin:8px 0}.step.dn{opacity:.45}.step.cur{border-color:var(--g)}
.step .n{color:var(--m);width:16px;font:400 12px var(--mono)}.step .em{font-size:20px}.step a{flex:1;color:inherit;font-weight:500}.step .mn{color:var(--m)}
.dash{display:inline-block;border:1px dashed var(--m);color:var(--t2);border-radius:10px;padding:8px 16px;margin:8px 0;background:none;font:inherit}.dash.on{border-color:var(--g);color:var(--g)}
.cta{display:block;width:100%;background:var(--g);color:var(--gi);border:0;border-radius:12px;min-height:48px;padding:12px;font:inherit;font-weight:500;font-size:16px;transition:transform .15s var(--ease)}
.lr{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:0 4px;border-bottom:1px solid var(--hl);color:var(--t);font-size:15px}.lr .li{display:flex;align-items:center;gap:12px}.lr .li svg.i{color:var(--m)}.lr>svg.i{color:var(--m);width:16px;height:16px}
.lc{display:block;background:var(--c);border:1px solid var(--hl);border-radius:14px;padding:16px;margin:8px 0;color:var(--t)}.lc b{display:block;font-weight:500}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.tile{background:var(--c);border:1px solid var(--hl);border-radius:14px;padding:12px 16px}.tile b{display:block;font:500 24px/1.3 var(--mono);margin:4px 0}
.big{font:500 56px/1 var(--mono);text-align:center;margin:16px 0}
#bc{width:200px;height:200px;border-radius:50%;background:var(--g);margin:32px auto;opacity:.85;transform:scale(.6)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{background:var(--c2);border:1px solid var(--hl);color:var(--t);border-radius:8px;min-height:32px;padding:4px 12px;font:inherit;font-size:14px}.chips button.on{background:var(--g);border-color:var(--g);color:var(--gi)}
.stick{position:sticky;top:env(safe-area-inset-top);z-index:4;background:var(--bg);box-shadow:0 -90px 0 var(--bg);padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.stick .top h1{font-size:20px}.stick .strip{margin:4px 0 8px}
@keyframes inL{from{transform:translateX(45%);opacity:.15}to{transform:none;opacity:1}}@keyframes inR{from{transform:translateX(-45%);opacity:.15}to{transform:none;opacity:1}}
.grid.inL{animation:inL .3s var(--ease)}.grid.inR{animation:inR .3s var(--ease)}
</style></head><body>
<div id="v"></div>
<div id="dock"><div id="cx"><span id="cxl"></span><button data-a="ctxdone">✓ Done</button><button data-a="ctxx">✕</button></div>
<div id="tb"><span id="tl" style="flex:1"></span><b id="tt"></b><button data-a="tadd" data-s="-15">−15</button><button data-a="tadd" data-s="15">+15</button><button data-a="tskip">Skip</button></div>
<div id="ctaw"></div></div>
<nav><a href="#/plan" data-p="plan"><svg class=i viewBox="0 0 24 24"><rect x=3 y=4 width=18 height=18 rx=2></rect><path d="M16 2v4M8 2v4M3 10h18"/></svg>Calendar</a><a href="#/more" data-p="more"><svg class=i viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>More</a></nav>
