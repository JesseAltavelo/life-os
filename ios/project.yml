name: LifeOS
options:
  bundleIdPrefix: com.jroque
  deploymentTarget:
    iOS: "16.1"
targets:
  LifeOS:
    type: application
    platform: iOS
    sources: [LifeOS]
    info:
      path: LifeOS/Info.plist
      properties:
        CFBundleDisplayName: Life OS
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        LSApplicationQueriesSchemes: [whatsapp, googlegmail, googlecalendar, spotify, shortcuts]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jroque.lifeos
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
